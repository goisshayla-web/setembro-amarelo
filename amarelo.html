<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>💛 Setembro Amarelo | Você Importa</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(circle at 20% 20%,
                    rgba(255, 221, 0, 0.35),
                    transparent 25%),

                radial-gradient(circle at 80% 80%,
                    rgba(255, 193, 7, 0.25),
                    transparent 30%),

                linear-gradient(135deg,
                    #111111,
                    #222222,
                    #080808);

            position: relative;
        }

        /* =================================
           ELEMENTOS DECORATIVOS
        ================================= */

        .particula {
            position: absolute;

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #ffd600;

            box-shadow:
                0 0 10px #ffd600,
                0 0 25px #ffd600;

            animation: subir 8s infinite linear;

            opacity: 0.7;
        }

        .particula:nth-child(1) {
            left: 10%;
            bottom: -20px;
            animation-duration: 7s;
        }

        .particula:nth-child(2) {
            left: 30%;
            bottom: -20px;
            animation-duration: 10s;
            animation-delay: 2s;
        }

        .particula:nth-child(3) {
            left: 55%;
            bottom: -20px;
            animation-duration: 8s;
            animation-delay: 1s;
        }

        .particula:nth-child(4) {
            left: 80%;
            bottom: -20px;
            animation-duration: 11s;
            animation-delay: 3s;
        }

        @keyframes subir {

            0% {
                transform: translateY(0) scale(1);
                opacity: 0;
            }

            20% {
                opacity: 0.8;
            }

            100% {
                transform:
                    translateY(-110vh)
                    scale(0.2);

                opacity: 0;
            }
        }

        /* =================================
           CARTÃO
        ================================= */

        .container {
            width: 90%;
            max-width: 720px;

            padding: 45px 40px;

            text-align: center;

            background:
                rgba(255, 255, 255, 0.08);

            border:
                1px solid rgba(255, 214, 0, 0.35);

            border-radius: 30px;

            backdrop-filter: blur(20px);

            box-shadow:
                0 20px 70px rgba(0, 0, 0, 0.6),

                0 0 40px
                rgba(255, 214, 0, 0.08);

            position: relative;

            z-index: 10;

            animation:
                entrada 1s ease;
        }

        @keyframes entrada {

            from {
                opacity: 0;
                transform:
                    translateY(40px)
                    scale(0.9);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }

        /* =================================
           GIRASSOL
        ================================= */

        .girassol {
            font-size: 65px;

            display: inline-block;

            margin-bottom: 5px;

            animation:
                girar 10s linear infinite,
                brilho 2s ease-in-out infinite alternate;
        }

        @keyframes girar {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes brilho {

            from {
                filter:
                    drop-shadow(0 0 3px #ffd600);
            }

            to {
                filter:
                    drop-shadow(0 0 25px #ffd600);
            }
        }

        /* =================================
           TÍTULO
        ================================= */

        h1 {
            color: #ffd600;

            font-size: 38px;

            margin-bottom: 5px;

            text-shadow:
                0 0 10px rgba(255, 214, 0, 0.4);
        }

        .subtitulo {
            color: #ffffff;

            opacity: 0.8;

            font-size: 16px;

            margin-bottom: 28px;
        }

        .destaque {
            color: #ffd600;

            font-weight: bold;
        }

        /* =================================
           CAIXA DA FRASE
        ================================= */

        .frase-container {

            min-height: 190px;

            padding: 30px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 214, 0, 0.10),
                    rgba(255, 255, 255, 0.04)
                );

            border:
                1px solid
                rgba(255, 214, 0, 0.18);

            margin-bottom: 25px;

            position: relative;

            overflow: hidden;
        }

        .frase-container::before {

            content: "";

            position: absolute;

            width: 150px;
            height: 150px;

            border-radius: 50%;

            background:
                rgba(255, 214, 0, 0.08);

            top: -80px;
            right: -50px;
        }

        #frase {

            color: white;

            font-size: 23px;

            line-height: 1.6;

            font-weight: 500;

            position: relative;

            z-index: 2;

            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.5);
        }

        /* =================================
           ANIMAÇÃO DA FRASE
        ================================= */

        .animar {

            animation:
                fraseEntrada 0.8s
                cubic-bezier(
                    0.175,
                    0.885,
                    0.32,
                    1.275
                );
        }

        @keyframes fraseEntrada {

            0% {
                opacity: 0;

                transform:
                    translateY(25px)
                    scale(0.85);

                filter: blur(10px);
            }

            60% {
                opacity: 1;

                transform:
                    translateY(-5px)
                    scale(1.04);

                filter: blur(0);
            }

            100% {
                transform:
                    translateY(0)
                    scale(1);
            }
        }

        /* =================================
           BOTÃO
        ================================= */

        button {

            border: none;

            padding:
                17px 38px;

            border-radius: 50px;

            background:
                linear-gradient(
                    135deg,
                    #ffd600,
                    #ffb300
                );

            color: #111;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 8px 25px
                rgba(255, 193, 7, 0.3);

            transition:
                all 0.3s ease;

            position: relative;

            overflow: hidden;
        }

        button::before {

            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 100%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.6),
                    transparent
                );

            transition:
                left 0.6s ease;
        }

        button:hover::before {

            left: 100%;
        }

        button:hover {

            transform:
                translateY(-4px)
                scale(1.04);

            box-shadow:
                0 12px 35px
                rgba(255, 193, 7, 0.5);
        }

        button:active {

            transform:
                scale(0.95);
        }

        /* =================================
           CONTADOR
        ================================= */

        #contador {

            margin-top: 18px;

            color: white;

            opacity: 0.5;

            font-size: 13px;
        }

        /* =================================
           MENSAGEM FINAL
        ================================= */

        #mensagemFinal {

            margin-top: 10px;

            color: #ffd600;

            font-size: 13px;

            opacity: 0;

            transition: 0.5s;
        }

        /* =================================
           RODAPÉ
        ================================= */

        .rodape {

            margin-top: 25px;

            color: white;

            opacity: 0.65;

            font-size: 14px;
        }

        .coracao {

            color: #ffd600;

            animation:
                pulsar 1.5s
                infinite;
        }

        @keyframes pulsar {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.3);
            }
        }

        /* =================================
           CELULAR
        ================================= */

        @media (max-width: 600px) {

            .container {
                padding:
                    30px 20px;
            }

            .girassol {
                font-size: 50px;
            }

            h1 {
                font-size: 29px;
            }

            .subtitulo {
                font-size: 14px;
            }

            #frase {
                font-size: 19px;
            }

            .frase-container {
                min-height: 200px;
            }

            button {
                width: 100%;
            }
        }

    </style>
</head>

<body>

    <!-- Partículas animadas -->
    <div class="particula"></div>
    <div class="particula"></div>
    <div class="particula"></div>
    <div class="particula"></div>


    <main class="container">

        <!-- Girassol -->
        <div class="girassol">
            🌻
        </div>


        <h1>
            Setembro Amarelo 💛
        </h1>


        <p class="subtitulo">
            Sua vida tem valor.
            <span class="destaque">
                Você importa.
            </span>
        </p>


        <!-- Frase -->
        <div class="frase-container">

            <p id="frase">
                Clique no botão para receber
                uma mensagem especial ✨
            </p>

        </div>


        <!-- Botão -->
        <button onclick="mostrarFrase()">

            ✨
            <span>
                Quero uma mensagem
            </span>

        </button>


        <!-- Contador -->
        <div id="contador">
            0 / 50 mensagens
        </div>


        <div id="mensagemFinal">
            🌻 Você chegou ao final! Uma nova sequência começou.
        </div>


        <div class="rodape">

            Espalhe esperança.
            Uma palavra pode fazer diferença.
            <span class="coracao">💛</span>

        </div>

    </main>


    <script>

        /* ==========================================
           50 FRASES
        ========================================== */

        const frases = [

            "Você é importante e sua existência faz diferença. 💛",

            "Mesmo nos dias difíceis, lembre-se: você não precisa enfrentar tudo sozinho.",

            "Um dia difícil não significa uma vida difícil. Amanhã pode ser diferente. 🌻",

            "Você já chegou até aqui. Isso mostra a força que existe em você.",

            "Não tenha vergonha de pedir ajuda. Cuidar de você também é um ato de coragem.",

            "Respire fundo. Você não precisa resolver tudo de uma vez.",

            "Sua história ainda tem muitos capítulos para serem escritos. 📖",

            "Você merece dias leves, momentos felizes e pessoas que cuidem de você.",

            "Não desista de você por causa de um momento difícil.",

            "Às vezes, continuar é a maior demonstração de coragem.",

            "Você não precisa ser forte o tempo todo. Permita-se descansar.",

            "Pequenos passos também são progresso. Continue no seu ritmo.",

            "Existe esperança mesmo quando ela parece distante. 🌅",

            "Você não está sozinho. Falar pode ser o primeiro passo para se sentir melhor.",

            "Cuide da sua mente com o mesmo carinho que você cuida das pessoas que ama.",

            "Se hoje está difícil, concentre-se apenas no próximo passo.",

            "Sua presença no mundo tem valor.",

            "Não tenha medo de dizer que precisa de ajuda. Isso é força, não fraqueza.",

            "Você merece acreditar que dias melhores podem chegar.",

            "Não permita que um momento doloroso defina toda a sua história.",

            "Continue. Há possibilidades que você ainda nem conhece.",

            "Você é mais do que seus problemas e mais do que seus dias ruins.",

            "Permita que alguém caminhe ao seu lado quando o caminho parecer pesado.",

            "A esperança pode começar com uma pequena conversa.",

            "Você merece ser ouvido, acolhido e respeitado.",

            "Não carregue tudo sozinho. Dividir o peso pode tornar o caminho mais leve.",

            "Seu futuro ainda pode surpreender você de maneiras bonitas.",

            "Mesmo uma pequena luz consegue iluminar um lugar escuro. ✨",

            "Tenha paciência consigo. Você está aprendendo a viver um dia de cada vez.",

            "Você não precisa ter todas as respostas agora.",

            "Há coragem em continuar tentando.",

            "Se precisar, pare, respire e recomece.",

            "Você merece cuidar de si sem culpa.",

            "Nenhuma tempestade dura para sempre. 🌦️",

            "Valorize cada pequena vitória que você conquista.",

            "Você pode procurar ajuda sempre que sentir que precisa.",

            "Sua vida não precisa ser perfeita para ter momentos especiais.",

            "Amanhã é uma nova oportunidade para tentar novamente.",

            "Não se cobre tanto. Você está fazendo o melhor que consegue.",

            "Você merece estar cercado de pessoas que valorizam sua presença.",

            "Falar sobre o que sentimos pode abrir espaço para a esperança.",

            "Um pedido de ajuda pode ser o começo de uma mudança.",

            "Você tem valor mesmo quando não consegue enxergá-lo.",

            "Continue procurando pequenos motivos para sorrir.",

            "Não desista de encontrar momentos bons no caminho.",

            "Seu sentimento é válido e merece ser ouvido.",

            "Você não precisa enfrentar uma fase difícil em silêncio.",

            "Existem pessoas dispostas a ouvir você.",

            "Cuide de você hoje. O seu futuro agradece.",

            "Você importa. Hoje, amanhã e todos os dias. 💛"

        ];


        /* ==========================================
           EMBARALHAMENTO
        ========================================== */

        function embaralhar(array) {

            for (
                let i = array.length - 1;
                i > 0;
                i--
            ) {

                const j =
                    Math.floor(
                        Math.random() * (i + 1)
                    );

                [
                    array[i],
                    array[j]
                ] =
                [
                    array[j],
                    array[i]
                ];
            }
        }


        /* ==========================================
           GARANTE QUE A PRIMEIRA ORDEM
           SEJA ALEATÓRIA
        ========================================== */

        embaralhar(frases);


        let indice = 0;


        /* ==========================================
           MOSTRAR FRASE
        ========================================== */

        function mostrarFrase() {

            const elemento =
                document.getElementById("frase");

            const contador =
                document.getElementById("contador");

            const mensagemFinal =
                document.getElementById("mensagemFinal");


            /* Remove a animação anterior */

            elemento.classList.remove(
                "animar"
            );


            /* Reinicia a animação */

            void elemento.offsetWidth;


            /* Mostra a frase */

            elemento.textContent =
                frases[indice];


            /* Adiciona animação */

            elemento.classList.add(
                "animar"
            );


            /* Atualiza contador */

            contador.textContent =
                `${indice + 1} / ${frases.length} mensagens`;


            /* Esconde mensagem final */

            mensagemFinal.style.opacity = "0";


            /* Próxima frase */

            indice++;


            /* ======================================
               QUANDO CHEGAR À ÚLTIMA FRASE
            ====================================== */

            if (
                indice >= frases.length
            ) {

                indice = 0;


                /*
                   Embaralha novamente.

                   Isso faz com que, depois das
                   50 frases, a próxima sequência
                   seja diferente.
                */

                setTimeout(() => {

                    embaralhar(frases);

                    mensagemFinal.style.opacity = "1";

                }, 600);

            }

        }

    </script>

</body>

</html>
